name: deploy to prod
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    #   - name: Setup Node.js   #npm installやnpm run buildが必要な場合はコメントアウトを外す
    #     uses: actions/setup-node@v4
    #     with:
    #       node-version: '22' # プロジェクトに合わせて変更してください
    #       cache: 'npm'
    #   - name: Install dependencies
    #     run: npm ci
    #   - name: Build.       # Buildが必要になったら追加
    #     run: npm run build # ここで dist フォルダが生成される想定
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact # 成果物に名前をつける
          path: . # buildで生成されたフォルダを指定
          retention-days: 1

  deploy:
    needs: build
    # deploy.ymlを再利用する
    uses: ./.github/workflows/deploy.yml
    # deploy.ymlに渡す環境変数を定義
    secrets:
      AWS_ROLE_ARN: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/pocket-insight-github-actions-rule
      AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_PROD }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
